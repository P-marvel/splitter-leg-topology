<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiber Splitter Tool</title>
  <script src="index.js"></script>
<link rel="stylesheet" href="index.css" >
</head>
<body>
  <div id="logo">
    <img src="fibernet logo.png" alt="Fibernet Logo">
  </div>
  <div class="container">
    <h2>Fiber Splitter Topology Finder</h2>
    <label for="sourcePower">Source Power (dB):</label>
    <input type="number" id="sourcePower" value="-13" step="any" />

    <label for="clients">Number of Clients:</label>
    <input type="number" id="clients" value="16" />

    <label for="threshold">Minimum Output Power (dB):</label>
    <input type="number" id="threshold" value="-29" step="any" />

    <button onclick="findTopologies()">Find Feasible Topologies</button>

    <div id="results" class="result"></div>
  </div>

  </body>
</html>
